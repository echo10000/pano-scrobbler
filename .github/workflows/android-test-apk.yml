name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Create temporary build configuration and test signing key
        shell: bash
        env:
          LASTFM_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$LASTFM_KEY" || -z "$LASTFM_SECRET" ]]; then
            echo 'Missing repository secrets: LASTFM_API_KEY and/or LASTFM_API_SECRET' >&2
            exit 1
          fi

          # A disposable key for testing, NOT for production updates.
          TEST_PASSWORD="$(openssl rand -hex 20)"
          TEST_KEYSTORE="$RUNNER_TEMP/pano-test-signing.jks"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 365 \
            -alias testbuild -keystore "$TEST_KEYSTORE" \
            -storepass "$TEST_PASSWORD" -keypass "$TEST_PASSWORD" \
            -dname 'CN=Android Test Build, OU=Open Source, O=Test, C=PH'

          # Upstream Gradle requires a Spotify field at configuration time.
          # The placeholder below does not enable Spotify integration.
          {
            printf 'lastfm.key=%s\n' "$LASTFM_KEY"
            printf 'lastfm.secret=%s\n' "$LASTFM_SECRET"
            printf 'spotify.refreshToken=disabled\n'
            printf 'releaseGithub.alias=testbuild\n'
            printf 'releaseGithub.keystorePath=%s\n' "$TEST_KEYSTORE"
            printf 'releaseGithub.password=%s\n' "$TEST_PASSWORD"
            printf 'releaseGithub.storePassword=%s\n' "$TEST_PASSWORD"
          } > local.properties
          chmod 600 local.properties

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --update
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed

      - name: Build open-source Android APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew androidApp:assembleReleaseGithub --no-daemon --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: pano-android-test-apk
          path: dist/pano-scrobbler-android-universal.apk
          if-no-files-found: error
          retention-days: 14
